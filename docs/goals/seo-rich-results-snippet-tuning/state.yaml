version: 2

goal:
  title: "SEO Rich Results And Snippet Tuning"
  slug: "seo-rich-results-snippet-tuning"
  kind: existing_plan
  tranche: "Validate live structured data and snippets, tune high-value notebooks/chapters metadata and copy, deploy verified changes, and record the Search Console recrawl checkpoint."
  status: done
  oracle:
    signal: "Live rendered metadata/JSON-LD checks, rich-results/schema validation evidence where available, repo checks, production deploy inspection, live route/tag smoke checks, and Search Console follow-up evidence or recrawl-wait receipt."
    cadence: "after Scout baseline, after Worker implementation, after production deploy, and at final audit"
    final_proof: "Final Judge/PM receipt maps deployed snippet/schema improvements and Search Console follow-up state to the original next-step plan with full_outcome_complete true."
  intake:
    original_request: "Plan a GoalBuddy prep board for this."
    interpreted_outcome: "Create a GoalBuddy board for the next SEO tranche: rich-results validation, notebooks/chapters snippet tuning, production deployment, and Search Console follow-up."
    input_shape: existing_plan
    audience: "Machine Learning Refined readers, instructors, independent learners, search crawlers, and the site owner."
    authority: requested
    proof_type: "test | artifact | metric | review"
    completion_proof: "Live structured data and snippets are validated, high-value pages are tuned and deployed, checks pass, and Search Console recrawl follow-up is recorded or explicitly waiting on Google."
    likely_misfire: "Doing generic SEO planning or copy edits without proving live schema/snippet state, deployment, or Search Console follow-up."
    blind_spots_considered:
      - "Google may not expose all rich-result eligibility for the schema types used."
      - "Search Console recrawl timing is outside local control."
      - "Snippet copy must not promise unavailable solutions/manual content."
      - "Existing dirty worktree must be preserved."
      - "Next.js 16 metadata file conventions must be followed."
    existing_plan_facts:
      - "Validate rich-results/structured data for homepage, /chapters, /notebooks, and a representative chapter detail page."
      - "Tune /notebooks around Machine Learning Refined GitHub notebooks, Python notebooks, and chapter resources."
      - "Tune /chapters and chapter detail snippets around chapter PDFs, exercises, slides, notebooks, and exact chapter topics."
      - "Add a Search Console checkpoint after recrawl for discovered pages, indexing state, and impressions."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/seo-rich-results-snippet-tuning/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.3.9/skills/goalbuddy/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal /Users/neonwatty/Desktop/mlrefined-website/docs/goals/seo-rich-results-snippet-tuning"

active_task: null

tasks:
