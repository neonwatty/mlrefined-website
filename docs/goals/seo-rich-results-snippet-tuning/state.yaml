    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map the current live structured-data, metadata, snippet, and rich-results validation state for the priority SEO pages."
    inputs:
      - "AGENTS.md"
      - "node_modules/next/dist/docs/ relevant metadata and OG image docs"
      - "Live https://www.mlrefined.com/"
      - "Live https://www.mlrefined.com/chapters"
      - "Live https://www.mlrefined.com/notebooks"
      - "Live representative chapter detail pages"
      - "src/lib/seo.ts"
      - "src/app route metadata files"
      - "docs/goals/seo-growth-roadmap/notes/T007-search-console-browser-review-2026-07-04.md"
      - "docs/goals/seo-growth-roadmap/notes/T009-url-inspection-indexing-requests-2026-07-04.md"
      - "docs/goals/seo-growth-roadmap/notes/T010-og-image-draft-2026-07-04.md"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Use rendered/live evidence where possible."
      - "Do not use Search Console API credentials; browser UI only if needed and already authenticated."
      - "Do not overclaim rich-result eligibility beyond what validators or rendered markup prove."
    expected_output:
      - "Per-page metadata and JSON-LD baseline."
      - "Rich-results/schema validation evidence or clear validator limitations."
      - "Snippet gaps ranked by likely search intent impact."
      - "Top three realistic failure modes to verify before completion."
      - "Recommended first Worker package."
    receipt:
      result: done
      note: "notes/T001-live-seo-schema-scout.md"
      summary: "Mapped live metadata, JSON-LD, crawl surfaces, Search Console context, and Google guidance. Highest-impact gaps are /notebooks visible/source-intent copy, missing /chapters JSON-LD, generic chapter descriptions that may overstate unavailable resource kinds, and stale sitemap lastmod values."
      evidence:
        - "Live metadata/JSON-LD extractor for /, /chapters, /notebooks, /chapters/introduction-to-machine-learning, /chapters/linear-regression."
        - "Structured-data sanity checker: 0 errors for routes with JSON-LD."
        - "robots.txt allows / and points to sitemap."
        - "sitemap.xml lists public and chapter URLs but lastmod remains 2026-06-26."
        - "Google Search Central structured data, title link, and snippet guidance."
      spawned_tasks:
        - T002

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Choose the largest safe first implementation package from the Scout evidence."
    inputs:
      - "T001 receipt"
      - "Goal oracle"
      - "Existing plan facts"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Prefer a vertical page/snippet/schema package over isolated tiny edits when safe."
      - "Every approved Worker package must include allowed_files, verify commands, and stop_if conditions."
    expected_output:
      - "Decision: approved, blocked, or needs more evidence."
      - "Exact Worker objective."
      - "allowed_files."
      - "verify commands and live checks."
      - "stop_if conditions."
      - "Deferred tasks or blockers."
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "Scout evidence shows a single safe vertical package can improve live schema/snippet readiness before recrawl: add /chapters collection JSON-LD, tune /notebooks source-intent metadata/copy, make chapter descriptions reflect actual resource kinds, and refresh sitemap lastmod for the July 4 SEO tranche."
      approved_worker_task: T003
      allowed_files:
        - "src/app/chapters/page.tsx"
        - "src/app/notebooks/page.tsx"
        - "src/app/chapters/[slug]/page.tsx"
        - "src/app/sitemap.ts"
        - "src/app/sitemap.test.ts"
        - "src/lib/seo.ts"
        - "src/lib/seo.test.ts"
        - "docs/goals/seo-rich-results-snippet-tuning/state.yaml"
        - "docs/goals/seo-rich-results-snippet-tuning/notes/**"
      verify:
        - "npm run lint"
        - "npm run typecheck"
        - "npm run test:unit"
        - "npm run build"
        - "Rendered inspection of /chapters, /notebooks, and representative /chapters/[slug] pages for title, description, canonical, robots, OG/Twitter tags, JSON-LD, visible copy, and sitemap lastmod."
      stop_if:
        - "Need files outside allowed_files."
        - "Snippet or schema copy would overpromise unavailable resources."
        - "Local Next docs contradict the intended metadata/sitemap approach."
        - "Verification fails twice with the same failure."

  - id: T003
