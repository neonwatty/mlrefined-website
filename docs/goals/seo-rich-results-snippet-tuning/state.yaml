    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Implement the approved schema/snippet tuning package: /chapters collection JSON-LD, /notebooks source-intent metadata/copy, resource-accurate chapter descriptions, and refreshed sitemap lastmod."
