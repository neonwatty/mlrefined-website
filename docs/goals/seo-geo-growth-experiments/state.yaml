version: 2

goal:
  title: "SEO And GEO Growth Experiments"
  slug: "seo-geo-growth-experiments"
  kind: existing_plan
  tranche: "Implement and measure successive safe SEO, GEO, GitHub-distribution, and resource-conversion improvements until the defined growth foundation and initial content experiments are live and evidenced."
  status: active
  oracle:
    signal: "Live crawlable internal architecture plus Search Console, PostHog, Bing/AI visibility when available, and production smoke evidence showing discovery and resource-use improvement."
    cadence: "after each Worker package, after production deployment, at the measurement checkpoint, and at final audit"
    final_proof: "Receipt-backed local and production evidence maps every required workstream to working behavior and records measured baselines/follow-up outcomes before full_outcome_complete: true."
  intake:
    original_request: "Make a detailed plan for the SEO/GEO improvements and implement it as a GoalBuddy prep board."
    interpreted_outcome: "Turn the completed SEO audit into a staged, executable growth program that improves page discovery, useful content surface area, GitHub distribution, generative-search eligibility, and measurable resource usage."
    input_shape: existing_plan
    audience: "Machine Learning Refined readers, instructors, independent learners, search engines, AI answer systems, and the site owner"
    authority: approved
    proof_type: metric
    completion_proof: "Priority internal-linking and conversion fixes, substantive content experiments, GitHub cross-distribution, crawler/entity readiness, production deployment, and durable search/usage measurement checkpoints are all implemented and verified."
    likely_misfire: "Shipping metadata, schema, or many thin pages without improving crawlable internal links, reader usefulness, GitHub/resource conversions, or measurable discovery."
    blind_spots_considered:
      - "Search Console indexing data is delayed and must not be treated as real-time truth."
      - "The resource and chapter-detail routes are weakly linked despite existing sitemap/schema coverage."
      - "Autocomplete demand for solutions/manual content must not cause misleading or piracy-adjacent claims."
      - "AI visibility is partly platform-controlled; eligibility and measurement are provable, guaranteed citations are not."
      - "The repository has more existing authority than the relaunched website and should be used as a distribution channel."
    existing_plan_facts:
      - "Preserve the completed technical SEO baseline: canonical metadata, JSON-LD, sitemap, robots, public routes, and Vercel deployment."
      - "First repair crawlable internal links to chapter-detail pages and /resources."
      - "Then improve branded GitHub/PDF/resource pathways and outbound analytics coverage."
      - "Publish a small set of substantive source-backed learning pages before considering broader content expansion."
      - "Strengthen GitHub README/entity cross-links and canonical resource paths."
      - "Keep OAI-SearchBot and standard search crawlers eligible; do not add speculative llms.txt work as a requirement."
      - "Use Search Console, PostHog, Bing Webmaster/AI reports when available, and live checks as evidence."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/seo-geo-growth-experiments/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.0/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/seo-geo-growth-experiments"

