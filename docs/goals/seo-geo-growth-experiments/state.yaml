      findings:
        - "Authenticated neonwatty account has admin and push authority on neonwatty/machine-learning-refined; no local checkout exists."
        - "Repository metadata already has the correct homepage, strong description, and seven relevant topics; no mutation is recommended there."
        - "README has 297 URL occurrences, 120 unique URLs, zero mlrefined.com links, 55 canonical repository occurrences, and 156 legacy jermwatt/machine_learning_refined Colab occurrences."
        - "Representative legacy and canonical Colab GETs both return 200, so replacement is canonical-consistency work rather than an emergency broken-link repair."
        - "The Cambridge force.com instructor link returns 404; the current official Cambridge second-edition page returns 200."
        - "The repository has no CITATION.cff and the README has no visible author, ISBN label, DOI, or citation block."
