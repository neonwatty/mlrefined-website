      allowed_files:
        - "src/content/book.types.ts"
        - "src/content/book-chapters.ts"
        - "src/content/book.test.ts"
        - "src/app/chapters/page.tsx"
        - "src/app/chapters/[slug]/page.tsx"
        - "src/app/sitemap.ts"
        - "src/app/sitemap.test.ts"
        - "src/lib/seo.ts"
        - "src/lib/seo.test.ts"
      verify:
        - "npm run lint"
        - "npm run typecheck"
        - "npm run test:unit"
        - "npm run build"
        - "Rendered inspection of /chapters and at least one /chapters/[slug] page for title, canonical, robots, JSON-LD, meaningful copy, and crawlable resource links."
      stop_if:
        - "Chapter resource URLs cannot be source-verified."
        - "Need files outside allowed_files."
        - "Dynamic route API differs from local Next docs."
        - "Verification fails twice with the same failure."
