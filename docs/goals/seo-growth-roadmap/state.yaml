        - "src/content/book-chapters.ts"
        - "src/content/book.test.ts"
        - "src/app/chapters/page.tsx"
        - "src/app/chapters/[slug]/page.tsx"
        - "src/app/sitemap.ts"
        - "src/app/sitemap.test.ts"
