version: 2

goal:
  title: "SEO Growth Roadmap"
  slug: "seo-growth-roadmap"
  kind: specific
  tranche: "Complete successive safe verified SEO architecture slices until Machine Learning Refined has materially stronger crawlable chapter/resource discovery and analytics-backed prioritization where credentials permit."
  status: done
  oracle:
    signal: "Rendered route inspection, sitemap/robots output, structured-data parseability, desktop/mobile screenshots for changed public pages, repo checks, and Search Console/PostHog evidence when credentials are present."
    cadence: "after each Worker package and at final audit"
    final_proof: "Final Judge/PM receipt maps implemented pages/schema/metadata/route hygiene to commands, rendered URLs, screenshots, and analytics/search evidence or explicit credential-blocked receipts."
  intake:
    original_request: "Create a GoalBuddy prep board for the next SEO work, and say what credentials are needed."
    interpreted_outcome: "Prepare a GoalBuddy board for the next technical/content SEO tranche and identify credential gates for analytics-backed SEO decisions."
    input_shape: specific
    audience: "Machine Learning Refined readers, instructors, independent learners, search crawlers, and the site owner."
    authority: requested
    proof_type: artifact
    completion_proof: "The board drives verified implementation of crawlable chapter/resource architecture, route metadata/schema hygiene, and available analytics-backed prioritization; final audit records full_outcome_complete: true."
    likely_misfire: "Adding more generic metadata or reports while failing to build crawlable resource pages and failing to use real search/analytics evidence when available."
    blind_spots_considered:
      - "Local checkout and live production route drift."
      - "Owner-only dashboard indexing and public-nav discoverability."
      - "Structured data overclaiming content the site does not provide."
      - "Missing Google Search Console, PostHog, Vercel, or domain verification credentials."
      - "Search demand around solutions/manual queries that should not be exploited with false promises."
    existing_plan_facts:
      - "Highest-confidence next local slice is a richer /chapters hub plus /chapters/[slug] pages."
      - "Likely follow-ups include /notebooks, /instructors, /reviews, OG/Twitter image generation, Search Console, and route-specific structured data."
      - "Credential-gated analytics work should be blocked at the task level, not at the whole-goal level."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/seo-growth-roadmap/"
    command: "node /Users/neonwatty/.codex/plugins/cache/goalbuddy/goalbuddy/0.3.9/skills/goalbuddy/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal /Users/neonwatty/Desktop/mlrefined-website/docs/goals/seo-growth-roadmap"

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: "Map the current local and live SEO route landscape, source content inventory, verification commands, and search/analytics evidence availability."
    inputs:
      - "AGENTS.md"
      - "README.md"
      - "package.json"
      - "src/app"
      - "src/content"
      - "src/lib"
      - "public"
      - "Live https://www.mlrefined.com routes, sitemap, and robots if network is available"
      - "Google autocomplete/search signals for Machine Learning Refined and resource-related terms"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Read local Next docs before recommending Next metadata/sitemap/robots/API changes."
      - "Prefer source-backed and rendered evidence over guesses."
    expected_output:
      - "Route/content inventory with local-vs-live drift noted."
      - "Ranked SEO opportunities with evidence and likely impact."
      - "Credential availability report: Search Console, PostHog, Vercel/domain, GitHub if relevant."
      - "Candidate next Worker packages."
    receipt:
      result: done
      summary: "Mapped local/live SEO state. Local checkout has /, /chapters, /resources, /dashboard plus SEO helper work in the dirty tree; live production additionally has /notebooks, /instructors, and /reviews in the sitemap, while /dashboard is 404 live. Search demand clusters around brand, 2nd edition, pdf, GitHub, book, notebooks, and optimization-book terms. Credential scaffolds exist but local Search Console/PostHog/Vercel credentials are absent; GitHub CLI is authenticated."
      evidence:
        - "AGENTS.md requires local Next docs and proof-heavy SEO verification."
        - "package.json scripts: lint, typecheck, knip:production, test:unit, build, ci."
        - "node_modules/next/dist/docs/01-app/01-getting-started/14-metadata-and-og-images.md"
        - "node_modules/next/dist/docs/01-app/02-guides/json-ld.md"
        - "node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/01-metadata/sitemap.md"
        - "node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/01-metadata/robots.md"
        - "src/content/book-chapters.ts has six highlighted chapters with stable slugs."
        - "src/content/book-resources.ts has four canonical GitHub resource groups."
        - "src/lib/seo.ts and src/app/* metadata work already present in dirty tree."
        - "Live https://www.mlrefined.com/sitemap.xml lists /, /notebooks, /chapters, /instructors, /resources, /reviews."
        - "Live /dashboard returns 404."
        - "Google autocomplete includes machine learning refined 2nd edition, pdf, github, book, solutions; broader terms include machine learning python notebooks and machine learning optimization book."
        - ".env.example contains blank PostHog and Search Console variables; .env.local, .env, .vercel/project.json are missing."
        - "gh auth status passes for neonwatty; vercel CLI missing."
      spawned_tasks:
        - T002
        - T003
        - T004
        - T005
        - T006
  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Choose the first largest safe useful SEO implementation slice from Scout evidence."
    inputs:
      - "T001 receipt"
      - "Goal oracle"
      - "Existing plan facts"
    constraints:
      - "Do not implement."
      - "Prefer a vertical crawlable-route slice over isolated metadata tweaks unless evidence says otherwise."
      - "Any Worker decision must include allowed_files, verify commands, and stop_if."
      - "Block only credential-gated tasks; keep local SEO work moving."
    expected_output:
      - "Decision"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Deferred or blocked credential tasks"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "The largest safe first slice is crawlable chapter detail architecture: it turns the existing six highlighted chapters into indexable pages with real GitHub resource links, improves /chapters internal linking, and expands the sitemap. This directly addresses the goal misfire risk better than another metadata-only pass. Credential-gated Search Console/PostHog work remains deferred to T006/T998."
